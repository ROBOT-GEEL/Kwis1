<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotoo Overview</title>
    <link rel="icon" type="image/x-icon" href="../shared/assets/icons/favicon.ico">
    <link rel="stylesheet" href="admin-panel.css">
</head>
<body>
    <div class="overview-container">
        
        <div class="overview-title">Robotoo Admin Panel</div>

        <div class="battery-status-container">
            <div id="batteryIcon" class="battery-icon"></div>
            <span id="batteryPercentage">Loading...</span>
        </div>

        <div class="main-grid">
            <button id="powerToggleBtn" class="grid-btn power-toggle-btn" onclick="toggleRobotPower()">
                <div class="power-icons-wrapper">
                    <div class="icon-box">
                        <img src="assets/icons/robot-wake.svg" id="iconWake" alt="Wake" class="power-icon">
                    </div>
                    <div class="icon-box">
                        <img src="assets/icons/robot-sleep.svg" id="iconSleep" alt="Sleep" class="power-icon">
                    </div>
                </div>
                <span id="powerToggleText">Laden...</span>
                <span id="powerToggleSubText">Laden...</span>
            </button>

            <button class="grid-btn" onclick="location.href='../cms'">
                <img src="assets/icons/questions.svg" alt="figuur vragen" class="btn-icon">
                <span>Vragen</span>
            </button>
            <button class="grid-btn" onclick="location.href='../settings'">
                <img src="assets/icons/settings.svg" alt="figuur instellingen" class="btn-icon">
                <span>Instellingen</span>
            </button>
            <button class="grid-btn" onclick="location.href='../statistieken'">
                <img src="assets/icons/bar-chart.svg" alt="figuur bar-chart" class="btn-icon">
                <span>Statistieken</span>
            </button>
            <button class="grid-btn" onclick="location.href='../manual-driving'">
                <img src="assets/icons/controller.svg" alt="figuur manueel rijden" class="btn-icon">
                <span>Manueel Rijden</span>
            </button>
            <button class="grid-btn" onclick="location.href='../diagnose'">
                <img src="assets/icons/diagnose.svg" alt="figuur diagnose" class="btn-icon">
                <span>Diagnose</span>
            </button>
            
        </div>

       <button id="backToQuizBtn" class="back-to-quiz-btn" style="display: block;" onclick="backToQuiz()">
            Terug naar quiz
        </button>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="../shared/scripts/admin-session.js"></script>
    <script src="./admin-panel.js"> </script>
</body>
</html>
