<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Statistieken</title>
    <link rel="icon" image="image/x-icon" href="../shared/assets/icons/favicon.ico">
    <link rel="stylesheet" href="statistieken.css">
</head>
<body>

    <div class="header-wrapper">
        <header class="settings-header">
            <h1 class="settings-title">Statistieken</h1>
            <p class="settings-description">Bekijk hier de resultaten van de quiz.</p>
            
            <div class="settings-button-row">               
                <button id="btnBack" class="settings-back-btn" onclick="window.location.href='../admin-panel'">
                    <span class="btn-text">Terug naar admin panel</span>
                </button>
            </div>
        </header>
    </div>

    <div class="toolbar-container">
        <div class="search-wrapper">
            <input 
                type="text" 
                id="statsSearchBar" 
                class="search-input"
                onkeyup="filterStats()" 
                placeholder="Zoek een resultaat of speler..." 
            >
        </div>

        <div class="filter-wrapper">
            <div class="filter-icon-box">
                <label class="enableSwitch fake-switch">
                    <input type="checkbox" id="uiStatusCheckbox" checked disabled>
                    <span class="slider round"></span>
                </label>
            </div>
            <select id="filterStatus" class="filter-select" onchange="filterStats()">
                <option value="all">Alle statussen</option>
                <option value="enabled">Actief</option>
                <option value="disabled">Inactief</option>
            </select>
        </div>

        <div class="filter-wrapper">
            <div class="filter-icon-box" id="uiDifficultyBox">
                <img id="uiDifficultyIcon" class="filter-icon-img" src="assets/icons/meterMakkelijk.svg" title="Filter"/>
            </div>
            <select id="filterDifficulty" class="filter-select" onchange="filterStats()">
                <option value="all">Alle niveaus</option>
                <option value="easy">Makkelijk</option>
                <option value="hard">Moeilijk</option>
            </select>
        </div>

    </div>

    <div class="page-wrapper" id="chartsContainer">
        <!-- Hier worden de grafieken dynamisch ingeladen door JavaScript -->
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="../shared/scripts/admin-session.js"></script>
    <script src="assets/chart/chart.js"></script>
    <script src="statistieken.js"></script>
    
</body>
</html>
